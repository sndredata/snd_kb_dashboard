name: KB 데이터 자동 업데이트

on:
  schedule:
    # 매주 금요일 09:10~10:00, 10분 간격 (한국 시간). GitHub 시간은 UTC 기준이고 몇 분~수십 분 늦게 시작될 수 있다.
    - cron: '10-50/10 0 * * 5'
    - cron: '0 1 * * 5'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: KB 최신 주차 가져오기
        id: kb
        if: github.event_name != 'push'
        run: node scripts/update.mjs

      - name: data.json 저장
        if: steps.kb.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "데이터 자동 업데이트 ${{ steps.kb.outputs.last }}"
          git push

      - name: 사이트 묶기
        if: github.event_name != 'schedule' || steps.kb.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 사이트 배포
        id: deploy
        if: github.event_name != 'schedule' || steps.kb.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

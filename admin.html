body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 48px}

function serialToDate(s){return new Date(Math.round((s-25569)*86400000)).toISOString().slice(0,10)}
function parseKB(wb){
  const errors=[],notes=[];
  const find=(a,b)=>wb.Sheets[a]||wb.Sheets[b];
  const rd=ws=>XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const out={names:D.names,kbhead:D.kbhead,cols:D.cols,sgroups:D.sgroups,skb:D.skb};
  const W4=[['mae','1.매매증감'],['jeon','2.전세증감'],['maeIdx','3.매매지수'],['jeonIdx','4.전세지수']];
  let dates=null;
  W4.forEach(([k,sn])=>{
    const ws=find(sn,sn.replace(/^\d\./,''));if(!ws){errors.push(`'${sn}' 탭이 없습니다.`);return}
    const R=rd(ws),H=R[1]||[];
    const rows=R.filter(r=>typeof r[0]==='number'&&r[0]>30000);
    const ds=rows.map(r=>serialToDate(r[0]));
    if(!dates)dates=ds;else if(JSON.stringify(dates)!==JSON.stringify(ds))errors.push(`'${sn}' 탭의 날짜가 '1.매매증감' 탭과 다릅니다.`);
    let bad=0;
    D.cols.forEach((c,i)=>{const h=H[c]==null?'':String(H[c]).trim();if(h!==D.kbhead[i]){bad++;if(bad<=4)errors.push(`'${sn}' ${c+1}번째 열 이름이 다릅니다: 기대 '${D.kbhead[i]}' / 실제 '${h}'`)}});
    if(bad>4)errors.push(`'${sn}'에서 총 ${bad}개 열 이름이 내장 구성과 다릅니다.`);
    out[k]=D.cols.map(c=>rows.map(r=>typeof r[c]==='number'?Math.round(r[c]*1000):null));
  });
  const S4=[['mae_s','5.매수우위'],['mae_t','6.매매거래활발'],['jeon_s','7.전세수급'],['jeon_t','8.전세거래활발']];
  let sd=null;
  S4.forEach(([k,sn])=>{
    const ws=find(sn,sn.replace(/^\d\./,''));if(!ws){errors.push(`'${sn}' 탭이 없습니다.`);return}
    const R=rd(ws),H=R[1]||[];
    const rows=R.filter(r=>typeof r[0]==='number'&&r[0]>30000);
    const ds=rows.map(r=>serialToDate(r[0]));
    if(!sd)sd=ds;else if(JSON.stringify(sd)!==JSON.stringify(ds))errors.push(`'${sn}' 탭의 날짜가 다른 심리 탭과 다릅니다.`);
    const gs=[];H.forEach((v,j)=>{if(j>0&&v!=null&&String(v).trim())gs.push(j)});
    if(gs.length!==D.skb.length){errors.push(`'${sn}' 지역 수가 다릅니다: 기대 ${D.skb.length}개 / 실제 ${gs.length}개`);return}
    let bad=0;gs.forEach((j,i)=>{const h=String(H[j]).split('\n')[0].split('  ')[0].trim();if(h!==D.skb[i]){bad++;if(bad<=4)errors.push(`'${sn}' ${i+1}번째 지역 이름이 다릅니다: 기대 '${D.skb[i]}' / 실제 '${h}'`)}});
    out[k]=gs.map(j=>[0,1,2].map(q=>rows.map(r=>typeof r[j+q]==='number'?Math.round(r[j+q]*100):null)));
  });
  out.dates=dates||[];out.sdates=sd||[];
  if(!errors.length){
    const nOld=D.dates.length,nNew=out.dates.length;
    notes.push(`주간 이력 ${nOld}주 → ${nNew}주 (${nNew-nOld>=0?'+':''}${nNew-nOld}주)`);
    const lastNull=D.names.filter((_,i)=>out.mae[i][nNew-1]==null);
    if(lastNull.length)notes.push(`최신 주 매매증감이 비어 있는 열: ${lastNull.slice(0,6).join(', ')}${lastNull.length>6?' 외':''}`);
  }
  return {D:out,errors,notes};
}

const GH={get(k){try{return localStorage.getItem('kbGh_'+k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem('kbGh_'+k,v)}catch(e){}}};
function ghGuess(){
  const m=location.hostname.match(/^([^.]+)\.github\.io$/),seg=location.pathname.split('/')[1]||'';
  return {owner:GH.get('owner')||(m?m[1]:''),repo:GH.get('repo')||(m?(seg&&!seg.includes('.')?seg:m[0]):'')};
}
function b64(str){const u=new TextEncoder().encode(str);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
async function ghApi(path,opt={}){
  const {owner,repo}=ghGuess();
  const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}${path}`,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH.get('token'),'X-GitHub-Api-Version':'2022-11-28'}});
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}
    throw new Error(r.status===401?'토큰이 올바르지 않거나 만료되었습니다.':r.status===404?'저장소를 찾을 수 없거나 토큰에 이 저장소 권한이 없습니다.':r.status===403?'토큰에 쓰기 권한(Contents: Read and write)이 없습니다. '+m:r.status+' '+m)}
  return r.json();
}
async function publish(){
  const {owner,repo}=ghGuess();
  if(!owner||!repo||!GH.get('token'))throw new Error('GitHub 사용자명, 저장소 이름, 토큰을 먼저 저장하세요.');
  const br=(await ghApi('')).default_branch;
  const tree=await ghApi('/git/trees/'+encodeURIComponent(br));
  const cur=tree.tree.find(x=>x.path==='data.json');
  const out=Object.assign({},D);delete out._src;
  await ghApi('/contents/data.json',{method:'PUT',body:JSON.stringify({message:'데이터 업데이트 '+lastDate(),content:b64(JSON.stringify(out)),branch:br,sha:cur?cur.sha:undefined})});
}

/* ---------- IndexedDB persistence (per browser) ---------- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('kb-series',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function saveIDB(d){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(d,'data')}catch(e){}}
async function loadIDB(){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get('data');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function clearIDB(){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').delete('data')}catch(e){}}

async function capturePng(secEl){
  const hide=secEl.querySelectorAll('[data-png-hide]');hide.forEach(e=>e.style.visibility='hidden');
  try{
    const cv=await html2canvas(secEl,{backgroundColor:getComputedStyle(document.body).backgroundColor,scale:2,useCORS:true});
    return await new Promise(r=>cv.toBlob(r,'image/png'));
  }finally{hide.forEach(e=>e.style.visibility='')}
}
async function savePng(secEl){
  if(!window.html2canvas){alert_('이미지 변환 라이브러리를 불러오지 못했습니다.');return}
  try{
    const blob=await capturePng(secEl);
    const name=(secEl.dataset.png||'table').replace(/[\\/:*?"<>|\s]+/g,'_')+'_'+lastDate()+'.png';
    await deliver(blob,name);
  }catch(e){alert_('이미지 변환에 실패했습니다: '+(e.message||e))}
}
async function deliver(blob,name){
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);
}

}
function alert_(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='note err';t.style.cssText='position:fixed;left:16px;right:16px;bottom:16px;z-index:9;max-width:520px;margin:auto';document.body.appendChild(t)}t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,4000)}
function showImg(url,name){let o=$('#imgov');if(!o){o=document.createElement('div');o.id='imgov';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;overflow:auto;padding:16px';o.addEventListener('click',()=>o.hidden=true);document.body.appendChild(o)}o.hidden=false;o.innerHTML=`<div class="note" style="max-width:900px;margin:0 auto 8px">이미지를 길게 누르거나 우클릭해서 저장하세요 · ${esc(name)}</div><img src="${url}" style="display:block;margin:auto;max-width:100%;background:#fff">`}
/* ---------- shell ---------- */
function mbin(v){
  const t=k=>[`var(--${k})`,`var(--${k}f)`];
  if(v==null)return ['var(--cell)','var(--muted)'];
  if(v>=0.8)return t('bu6');
  if(v>=0.6)return t('bu5');
  if(v>=0.4)return t('bu4');
  if(v>=0.2)return t('bu3');
  if(v>=0.1)return t('bu2');
  if(v>0.05)return t('bu1');
  if(v>=-0.05)return ['var(--cell)','var(--fg)'];
  if(v>-0.1)return t('bd1');
  if(v>-0.2)return t('bd2');
  if(v>-0.4)return t('bd3');
  if(v>-0.6)return t('bd4');
  if(v>-0.8)return t('bd5');
  return t('bd6');
}
function mst(v){const [bg,fg]=mbin(v);return `background:${bg};color:${fg}`}
const cellM=(v,c='')=>`<td class="h ${c}" style="${mst(v)}">${f2(v)}</td>`;
function mapLegend(extra){
  const sw=[[-0.9,'≤-0.8'],[-0.7,'-0.6'],[-0.5,'-0.4'],[-0.3,'-0.2'],[-0.15,'-0.1'],[-0.07,'-0.05'],[0,'±0.05'],[0.07,'0.05'],[0.15,'0.1'],[0.3,'0.2'],[0.5,'0.4'],[0.7,'0.6'],[0.9,'0.8≤']];
  return `<div class="legend" style="flex-wrap:wrap;margin-bottom:10px"><span>하락</span>${sw.map(([v,t])=>`<span class="sw" style="${mst(v)}">${t}</span>`).join('')}<span>상승</span><span style="margin-left:8px">${extra}</span></div>`;
}
function mapExample(){
  return (()=>{const m=wv('mae','서울',L),j=wv('jeon','서울',L),[mb,mf]=mbin(m),[jb,jf]=mbin(j);
    return `<div class="mex"><div class="mt" style="width:84px;height:66px"><div class="mn">서울</div><div style="background:${mb};color:${mf}">${f2(m)}</div><div style="background:${jb};color:${jf}">${f2(j)}</div></div><ul><li><b>1행</b> 지역명</li><li><b>2행</b> 매매 증감률(전주 대비 %)</li><li><b>3행</b> 전세 증감률(전주 대비 %)</li></ul><span class="muted">← 읽는 법 (예: 서울)</span></div>`})();
}
function mapCard(title,blocks,png,noEx){
  const r0=Math.min(...blocks.map(b=>b.r));
  const rows=Math.max(...blocks.map(b=>b.r))-r0+3;
  const tiles=blocks.map(b=>{
    const m=wv('mae',b.n,L),j=wv('jeon',b.n,L),[mb,mf]=mbin(m),[jb,jf]=mbin(j);
    return `<div class="mt" style="grid-column:${b.c-5};grid-row:${b.r-r0+1}/span 3"><div class="mn">${esc(b.n)}</div><div style="background:${mb};color:${mf}">${f2(m)}</div><div style="background:${jb};color:${jf}">${f2(j)}</div></div>`}).join('');
  const ex=noEx?'':mapExample();
  const legend=mapLegend(`각 칸: 지역 / 매매 / 전세 (전주 대비 %, 기준일 ${lastDate()}) · 숫자는 색 구간의 시작 경계`);
  return card(title,`${ex}${legend}<div class="tw"><div class="mapgrid" style="grid-template-rows:repeat(${rows},21px)">${tiles}</div></div>`,{png});
}
const SIDO_OF=(()=>{const m={};CFG.groups33.forEach(g=>g.regions.forEach(n=>{m[n]=/^경기/.test(g.title)?'경기':g.title}));m['제주']='제주';m['세종']='세종';['춘천','강릉','원주'].forEach(n=>m[n]='강원');return m})();
const SIDO_ORDER=['서울','경기','인천','세종','부산','대구','광주','대전','울산','강원','충북','충남','전북','전남','경북','경남','제주'];
function mapTile(b){
  const m=wv('mae',b.n,L),j=wv('jeon',b.n,L),[mb,mf]=mbin(m),[jb,jf]=mbin(j);
  return `<div class="mt" style="height:66px"><div class="mn">${esc(b.n)}</div><div style="background:${mb};color:${mf}">${f2(m)}</div><div style="background:${jb};color:${jf}">${f2(j)}</div></div>`;
}
function mapMobile(){
  const ord={};let oi=0;CFG.groups33.forEach(g=>g.regions.forEach(n=>{if(!(n in ord))ord[n]=oi++}));
  const all=[...CFG.mapA,...CFG.mapB].slice().sort((p,q)=>(ord[p.n]??999)-(ord[q.n]??999));
  const by={};all.forEach(b=>{const k=SIDO_OF[b.n]||'기타';(by[k]=by[k]||[]).push(b)});
  const keys=SIDO_ORDER.filter(k=>by[k]).concat(Object.keys(by).filter(k=>!SIDO_ORDER.includes(k)));
  const secs=keys.map(k=>`<div class="sd"><h3>${esc(k)}</h3><div class="mtg">${by[k].map(mapTile).join('')}</div></div>`).join('');
  const legend=mapLegend(`각 칸: 지역 / 매매 / 전세 (전주 대비 %, 기준일 ${lastDate()})`);
  return card('지역 동향 · 시·도별',`${mapExample()}${legend}${secs}`,{png:'주간동향_시도별'});
}
function viewMap(){if(narrow())return mapMobile();return mapCard('수도권 주간 동향',CFG.mapA,'주간동향_수도권')+mapCard('광역시 및 지방 주요 도시 주간 동향',CFG.mapB,'주간동향_광역시지방')}
const TABS=[['week','주간동향',viewWeek],['wk5','지역별 5주 흐름',viewWk5],['top','증감 상위',viewTop],['chart','증감·심리',viewChart],['c33','33차트',view33],['ts','시계열',viewTs],['data','데이터 업데이트',viewData]].filter(t=>!(VIEWER&&t[0]==='data'));
function asof(){$('#asof').textContent=`기준일 ${lastDate()} · KB부동산 주간 시계열${D._src==='upload'?' · 업로드 데이터':''}`}
function render(){
  $('#tabs').innerHTML=TABS.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${t[0]===S.tab}">${t[1]}</button>`).join('');
  const t=TABS.find(x=>x[0]===S.tab)||TABS[0];
  $('#view').innerHTML=t[2]();
  if(S.tab==='chart'){const {ds,series,kind}=cseries();lineChart($('#chartHost'),{dates:ds,series,fmt:kind==='w'?f2:f1,zero:kind==='w',h:340})}
  if(S.tab==='data')bindData();
  if(S.tab==='top')layoutBars();
  const p=$('#period');if(p)p.addEventListener('change',()=>{S.period=+p.value;render()});
  try{history.replaceState(null,'','#'+S.tab)}catch(e){}
}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const sg=e.target.closest('[data-seg]');
  if(sg){const k=sg.dataset.seg;let v=sg.dataset.v;if(['cwin','topN','tsWin'].includes(k))v=+v;S[k]=v;render();return}
  const ac=e.target.closest('[data-act]');if(!ac)return;
  const a=ac.dataset.act;
  if(a==='reg'){const r=ac.dataset.v,i=S.sel.indexOf(r);
    if(i>=0){S.sel.splice(i,1);delete S.colors[r]}else if(S.sel.length<8){S.sel.push(r)}else alert_('최대 8개 지역까지 선택할 수 있습니다.');
    render()}
  if(a==='clearsel'){S.sel=[];S.colors={};render();return}
  if(a==='preset'){const p=PRESETS[+ac.dataset.v];S.sel=[...p[1]];S.colors={};render()}
  if(a==='png')savePng(ac.closest('.card'));
  if(a==='reset'){clearIDB().then(()=>location.reload())}
  if(a==='ghsave'){GH.set('owner',$('#ghOwner').value.trim());GH.set('repo',$('#ghRepo').value.trim());const t=$('#ghToken').value.trim();if(t)GH.set('token',t);PUB={t:'ok',h:'저장했습니다.'};render();return}
  if(a==='ghpub'){doPublish();return}
  if(a==='kbfetch'){kbFetch();return}
});
let THEME='auto';
try{THEME=localStorage.getItem('kbTheme')||'auto'}catch(e){}
function applyTheme(t){THEME=t;const r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeSet===t));
  try{localStorage.setItem('kbTheme',t)}catch(e){}}
document.querySelectorAll('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>applyTheme(b.dataset.themeSet)));
applyTheme(THEME);
$('#expAll').addEventListener('click',exportAll);
$('#goData').addEventListener('click',()=>{S.tab='data';render();window.scrollTo(0,0)});
try{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))S.tab=h}catch(e){}
(async()=>{
  try{const r=await fetch('data.json?v='+Math.floor(Date.now()/60000),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);D=await r.json()}
  catch(e){$('#view').innerHTML='<div class="note err">데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요. ('+esc(e.message||e)+')</div>';return}
  BASE_LAST=D.dates[D.dates.length-1];setup();asof();render();
  if(!VIEWER)loadIDB().then(d=>{if(d&&d.dates&&d.dates[d.dates.length-1]>BASE_LAST){D=d;D._src='upload';setup();asof();render()}});
})();
})();
</script>
